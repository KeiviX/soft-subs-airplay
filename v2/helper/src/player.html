<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soft Subs</title>
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --fg: #1c1b19; --muted: #6b6862; --line: #e3e0da;
    --accent: #c2410c; --accent-fg: #ffffff; --ok: #15803d; --bad: #b91c1c;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121110; --surface: #1c1b19; --fg: #f1efea; --muted: #a29e96; --line: #2e2c29;
            --accent: #fb923c; --accent-fg: #1c1b19; --ok: #4ade80; --bad: #f87171; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 880px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
  .brand { font-weight: 600; letter-spacing: -0.01em; }
  h1 { font-size: 15px; font-weight: 400; color: var(--muted); margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; }
  .status { display: flex; align-items: center; gap: 10px; margin: 16px 0; min-height: 24px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.tv { background: var(--ok); }
  .dot.bad { background: var(--bad); }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  button { font: inherit; border-radius: 10px; padding: 10px 18px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
  button:disabled { opacity: 0.45; cursor: default; }
  .group { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .group span { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 92px; text-align: center; }
  .seekbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0 0; }
  .seekbar .time { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: auto; }
  .seekbar input { font: inherit; width: 84px; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
  .note { color: var(--muted); font-size: 13px; margin-top: 20px; }
  @media (max-width: 560px) { .group { margin-left: 0; } }
</style>
</head>
<body>
<main>
  <header>
    <span class="brand">Soft Subs</span>
    <h1 id="title"></h1>
  </header>
  <video id="video" controls playsinline x-webkit-airplay="allow" preload="metadata"></video>
  <div class="status"><span class="dot" id="dot"></span><span id="status">Loading the stream…</span></div>
  <div class="controls">
    <button class="primary" id="tv" disabled>Play on TV</button>
    <button id="here" disabled>Play here</button>
    <div class="group" aria-label="Subtitle timing">
      <button id="earlier" disabled title="Show subtitles earlier">Earlier</button>
      <span id="offset">Subtitles 0.00s</span>
      <button id="later" disabled title="Show subtitles later">Later</button>
    </div>
    <button id="stop" disabled>Stop</button>
  </div>
  <div class="seekbar">
    <span class="time" id="clock">0:00</span>
    <button id="back" disabled>−10 s</button>
    <button id="ahead" disabled>+10 s</button>
    <input id="goto" placeholder="mm:ss" inputmode="numeric" aria-label="Go to time" disabled>
    <button id="go" disabled>Go</button>
  </div>
  <p class="note" id="note">Keep this tab open while you watch. You can switch to other tabs.</p>
</main>
<script>
  const id = location.pathname.split('/')[2];
  const base = `/s/${id}`;
  const video = document.getElementById('video');
  const $ = (name) => document.getElementById(name);
  const post = (path, body) => fetch(base + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body ?? {}) });
  const canAirPlay = typeof video.webkitShowPlaybackTargetPicker === 'function';
  let master = null;
  let startTime = 0;
  let ended = false;

  function setStatus(text, kind = '') {
    $('status').textContent = text;
    $('dot').className = `dot ${kind}`;
  }

  function enable(on) {
    for (const name of ['tv', 'here', 'earlier', 'later', 'stop', 'back', 'ahead', 'goto', 'go']) $(name).disabled = !on;
    if (!canAirPlay) $('tv').disabled = true;
  }

  function describePlayback() {
    if (ended) return;
    if (video.webkitCurrentPlaybackTargetIsWireless) setStatus(video.paused ? 'Paused on your TV.' : 'Playing on your TV.', 'tv');
    else if (!video.paused) setStatus('Playing on this computer. Click Play on TV to send it to your TV.');
    else if (master) setStatus(canAirPlay ? 'Ready. Click Play on TV and pick your TV.' : 'Ready. Open this page in Safari to send it to an AirPlay TV.');
  }

  // Loads (or reloads) the stream starting at `at` seconds. The start goes into the playlist (#EXT-X-START)
  // and into currentTime before the stream loads, so the TV starts there and the seek Safari sends with a new
  // stream is to the same place. (A seek to 0:00 while the TV starts elsewhere is never confirmed, and Safari
  // then holds every later seek behind it.)
  let reloadedAt = 0;
  function load(url, at, play) {
    master = url;
    reloadedAt = Date.now();
    const start = Math.max(0, at || 0);
    video.src = start > 0.5 ? `${url}${url.includes('?') ? '&' : '?'}start=${start.toFixed(3)}` : url;
    if (start > 0.5) video.currentTime = start;
    lastTime = start;
    if (play) video.play().catch(() => {});
  }

  // Skips with an ordinary seek, which an AirPlay TV handles smoothly once it's playing.
  let target = null;
  function jump(to) {
    if (!master || ended) return;
    const duration = Number.isFinite(video.duration) ? video.duration : Infinity;
    target = Math.min(Math.max(0, to), Math.max(0, duration - 3));
    video.currentTime = target;
  }

  const clock = (seconds) => {
    if (!Number.isFinite(seconds)) return '0:00';
    const total = Math.floor(seconds), h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), sec = String(total % 60).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2, '0')}:${sec}` : `${m}:${sec}`;
  };
  let lastTime = 0;
  let seekingSince = 0;
  video.addEventListener('timeupdate', () => {
    if (!video.seeking) lastTime = video.currentTime;
    $('clock').textContent = `${clock(video.seeking && target != null ? target : video.currentTime)} / ${clock(video.duration)}`;
  });
  video.addEventListener('seeking', () => {
    if (!seekingSince) seekingSince = Date.now();
    target = video.currentTime;
  });
  video.addEventListener('seeked', () => { seekingSince = 0; target = null; });

  // Watchdog: if the TV never confirms a seek, Safari stops sending seeks at all. Reload once at the
  // wanted time, which starts the TV there and clears Safari's stuck seek.
  setInterval(() => {
    if (ended || !master || !video.webkitCurrentPlaybackTargetIsWireless || !video.seeking || !seekingSince) return;
    if (Date.now() - seekingSince < 6000 || Date.now() - reloadedAt < 10000) return;
    const to = target ?? lastTime;
    note(`seek to ${to.toFixed(1)}s not confirmed by the TV after ${Math.round((Date.now() - seekingSince) / 1000)}s; reloading there`);
    seekingSince = 0;
    load(master, to, true);
  }, 1000);

  // Handing over to the TV can restart it from 0:00; put it back where it was.
  video.addEventListener('webkitcurrentplaybacktargetiswirelesschanged', () => {
    note(video.webkitCurrentPlaybackTargetIsWireless ? `handed to the TV at ${lastTime.toFixed(1)}s` : 'back on this computer');
    if (!video.webkitCurrentPlaybackTargetIsWireless) return;
    const resume = lastTime;
    setTimeout(() => {
      if (resume > 5 && Math.abs(video.currentTime - resume) > 5) {
        note(`TV started at ${video.currentTime.toFixed(1)}s; seeking back to ${resume.toFixed(1)}s`);
        jump(resume);
      }
    }, 2500);
  });

  $('back').onclick = () => jump(video.currentTime - 10);
  $('ahead').onclick = () => jump(video.currentTime + 10);
  const goTo = () => {
    const parts = $('goto').value.trim().split(':').map(Number);
    if (!parts.length || parts.some((n) => !Number.isFinite(n))) return;
    jump(parts.reduce((total, n) => total * 60 + n, 0));
    $('goto').value = '';
  };
  $('go').onclick = goTo;
  $('goto').addEventListener('keydown', (event) => { if (event.key === 'Enter') goTo(); });

  async function poll() {
    let info;
    try { info = await (await fetch(`${base}/info`)).json(); } catch { setTimeout(poll, 1500); return; }
    if (info.title) { $('title').textContent = info.title; document.title = `${info.title} · Soft Subs`; }
    if (info.state === 'stopped') { finish(info.phase); return; }
    if (info.state === 'failed') { setStatus(info.phase, 'bad'); return; }
    if (info.state === 'preparing') { setStatus(info.phase); setTimeout(poll, 700); return; }
    if (!master) {
      startTime = info.startTime || 0;
      $('offset').textContent = `Subtitles ${Number(info.offset || 0).toFixed(2)}s`;
      if (info.subtitles) $('note').textContent = `${info.subtitles} · Keep this tab open while you watch.`;
      load(info.master, startTime, false);
      enable(true);
      describePlayback();
    }
    setTimeout(poll, 3000);
  }

  function finish(message) {
    ended = true;
    video.pause();
    video.removeAttribute('src');
    video.load();
    enable(false);
    setStatus(message || 'Stopped.');
  }

  $('tv').onclick = () => {
    // Both inside the click, so the browser treats them as the person's own action.
    video.play().catch(() => {});
    video.webkitShowPlaybackTargetPicker();
  };
  $('here').onclick = () => video.play().catch(() => {});
  $('stop').onclick = async () => { await post('/stop').catch(() => {}); finish('Stopped. Start a new cast from the extension.'); };

  let pendingNudge = 0;
  let nudgeTimer = null;
  function nudge(delta) {
    pendingNudge += delta;
    $('offset').textContent = `Subtitles ${(Number($('offset').textContent.match(/-?[\d.]+/)?.[0] || 0) + delta).toFixed(2)}s`;
    clearTimeout(nudgeTimer);
    // Several clicks in a row become one reload.
    nudgeTimer = setTimeout(async () => {
      const total = pendingNudge;
      pendingNudge = 0;
      const result = await (await post('/offset', { delta: total })).json().catch(() => null);
      if (!result?.ok) return;
      $('offset').textContent = `Subtitles ${result.offset.toFixed(2)}s`;
      load(result.master, video.currentTime, !video.paused);
    }, 700);
  }
  $('earlier').onclick = () => nudge(-0.25);
  $('later').onclick = () => nudge(0.25);

  for (const name of ['play', 'pause', 'playing', 'waiting']) video.addEventListener(name, describePlayback);
  video.addEventListener('webkitcurrentplaybacktargetiswirelesschanged', () => { describePlayback(); report(); });
  video.addEventListener('error', () => {
    if (!ended && video.error) setStatus(`The stream couldn't play (${video.error.message || 'error ' + video.error.code}).`, 'bad');
  });

  function report(message) {
    if (ended || !master) return;
    const body = { wireless: !!video.webkitCurrentPlaybackTargetIsWireless, playing: !video.paused, time: video.currentTime, seeking: video.seeking };
    if (message) body.note = message;
    post('/state', body).catch(() => {});
  }
  // Sends a line to the helper's log, for diagnosing what the browser and TV did.
  const note = (message) => report(message);
  setInterval(report, 2000);

  if (!canAirPlay) $('note').textContent = 'AirPlay needs Safari. Open this page in Safari to send the video to your TV.';
  poll();
</script>
</body>
</html>
