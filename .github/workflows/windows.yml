name: Windows

on:
  push:
    branches: [main]
    paths: ["windows/**", "Extension/Resources/**", "scripts/build_chrome.py", ".github/workflows/windows.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick version
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "release") { "${{ github.event.release.tag_name }}".TrimStart("v") }
                     else { (Get-Content Extension/Resources/manifest.json | ConvertFrom-Json).version }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Unit tests
        working-directory: windows
        run: |
          python -m pip install --quiet -r requirements.txt pytest
          python -m pytest -q tests

      - name: Build installer
        shell: pwsh
        run: windows/build.ps1 -Version $env:VERSION

      - name: Smoke test the built app
        shell: pwsh
        run: windows/smoke-test.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: SoftSubs-Windows-${{ env.VERSION }}
          path: |
            dist/SoftSubs-Setup-*.exe
            dist/SoftSubs-Chrome-*.zip

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "dist/SoftSubs-Setup-${{ env.VERSION }}.exe" "dist/SoftSubs-Chrome-${{ env.VERSION }}.zip" --clobber
