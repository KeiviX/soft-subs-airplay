name: SoftSubsAirPlay
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    # Ad-hoc by default; build.sh switches to your own Apple Development certificate when you have one.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 0.1.1
    CURRENT_PROJECT_VERSION: 1
    ENABLE_HARDENED_RUNTIME: NO
targets:
  SoftSubs:
    type: application
    platform: macOS
    sources:
      - App
    settings:
      base:
        PRODUCT_NAME: Soft Subs
        PRODUCT_MODULE_NAME: SoftSubs
        PRODUCT_BUNDLE_IDENTIFIER: com.keivi.softsubs
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postCompileScripts:
      # The Chrome build of the extension, for Chrome-based browsers on the Mac (Load unpacked).
      - name: Bundle Chrome extension
        script: python3 "$SRCROOT/scripts/build_chrome.py" --out "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/chrome-extension"
        basedOnDependencyAnalysis: false
      # The Rust helper that serves streams to the TV, and its login-item plist (v2).
      - name: Bundle helper
        script: '"$SRCROOT/scripts/bundle_helper.sh"'
        basedOnDependencyAnalysis: false
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Soft Subs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        NSLocalNetworkUsageDescription: Soft Subs serves the video and its subtitles to your TV over your local network.
        # The helper does the work in the background; the app is only for setup.
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.keivi.softsubs
            CFBundleURLSchemes: [softsubs]
    entitlements:
      path: App/SoftSubs.entitlements
      properties: {}
    dependencies:
      - target: SoftSubsExtension
  SoftSubsExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Extension/SafariWebExtensionHandler.swift
      - path: Extension/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Soft Subs Extension
        PRODUCT_MODULE_NAME: SoftSubsExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.keivi.softsubs.extension
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: Soft Subs AirPlay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: Extension/SoftSubsExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
